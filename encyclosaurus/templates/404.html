{% extends 'encyclosaurus/base.html' %}

{% block title %}Browse Dinosaurs - Encyclosaurus{% endblock %}

{% block extra_css %}
<style>
    .browse-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .browse-title {
        text-align: center;
        color: var(--primary-color);
        margin-bottom: 2rem;
    }

    .browse-section {
        margin-bottom: 2rem;
        padding: 1rem;
        border: 1px solid #e1e1e1;
        border-radius: 5px;
    }

    .section-title {
        color: var(--secondary-color);
        margin-bottom: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="browse-container">
    <h2 class="browse-title">Resource Not Found</h2>

    <div class="browse-section">
        <h3 class="section-title"></h3>
        <p>
            The requested resource has been lost to the sands of time.
            Try digging again from our homepage!
        </p>
    </div>
</div>
{% endblock %}
</div>
